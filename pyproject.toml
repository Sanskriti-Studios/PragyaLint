[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pragyalint"
version = "0.1.2"
description = "Static dead-code analyzer for Python projects"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "IndianCoder3" }]
keywords = [
    "dead-code",
    "lint",
    "analyzer",
    "prune",
    "cleanup",
    "static-analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Sanskriti-Studios/PragyaLint"
Repository = "https://github.com/Sanskriti-Studios/PragyaLint"
Documentation = "https://github.com/Sanskriti-Studios/PragyaLint"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
pragyalint = "pragyalint.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pragyalint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
